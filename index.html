    <script>
        'use strict';
        
        // ============================================
        // داده‌های کامل (۹ مبحث با ۹۰ تست و مثال‌های بیشتر)
        // ============================================
        const topics = [
            {
                id: "tenses",
                icon: "⏰",
                label: "زمان‌ها",
                title: "زمان‌ها (Tenses)",
                lesson: `<div class="lesson-full"><p class="intro"><strong>زمان‌ها</strong> ستون اصلی گرامر انگلیسی هستند. <span class="stat-badge">حدود ۳۰٪ سوالات گرامر کنکور</span> به زمان‌ها اختصاص دارد. درک درست آنها، گام اول برای تسلط بر گرامر است.</p>
                <div class="tense-section"><h3>۱. حال ساده (Simple Present)</h3><div class="tense-box"><h4>📌 ساختار:</h4><div class="structure">فاعل + فعل (s/es برای سوم شخص مفرد) + متمم</div><div class="structure">I/You/We/They → work &bull; He/She/It → works</div><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">I <strong>work</strong> every day.</span><span class="ex-trans">(من هر روز کار می‌کنم)</span></div><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">She <strong>works</strong> in a hospital.</span><span class="ex-trans">(او در بیمارستان کار می‌کند)</span></div></div></div><div class="tense-box"><h4>🎯 کاربردها:</h4><ul><li><strong>حقایق علمی و کلی:</strong> <em>The sun rises in the east.</em> (خورشید از شرق طلوع می‌کند)</li><li><strong>عادت‌ها و کارهای تکراری:</strong> <em>I drink coffee every morning.</em> (هر روز صبح قهوه می‌نوشم)</li><li><strong>برنامه‌های ثابت:</strong> <em>The train leaves at 6 PM.</em> (قطار ساعت ۶ حرکت می‌کند)</li><li><strong>حالات و احساسات:</strong> <em>I love this movie.</em> (این فیلم را دوست دارم)</li></ul></div><div class="tense-box"><h4>⚠️ نکات کنکوری:</h4><ul><li><strong>قیدهای زمان:</strong> always, usually, often, sometimes, never, every day</li><li><span class="highlight">تله تستی:</span> ❌ اشتباه: <em>I am going to school every day.</em> ✅ صحیح: <em>I go to school every day.</em> (چون every day نشان‌دهنده عادت است)</li></ul></div></div>
                <div class="tense-section"><h3>۲. حال استمراری (Present Continuous)</h3><div class="tense-box"><h4>📌 ساختار:</h4><div class="structure">فاعل + am/is/are + فعل + ing + متمم</div><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">I <strong>am reading</strong> a book now.</span><span class="ex-trans">(الان در حال خواندن کتاب هستم)</span></div></div></div><div class="tense-box"><h4>🎯 کاربردها:</h4><ul><li><strong>کار در حال انجام الان:</strong> <em>I am reading a book right now.</em></li><li><strong>برنامه‌های آینده‌ای نزدیک:</strong> <em>I am meeting my friend tomorrow.</em> <span class="highlight">نکته کنکوری</span></li></ul></div><div class="tense-box"><h4>⚠️ نکات کنکوری:</h4><ul><li><strong>قیدهای زمان:</strong> now, right now, at the moment, these days</li><li><strong>افعال Stative (بدون ing):</strong> know, believe, love, hate, want, need</li><li><span class="highlight">تله تستی:</span> ❌ اشتباه: <em>She is knowing the answer.</em> ✅ صحیح: <em>She knows the answer.</em> (افعال state با ing نمی‌آیند)</li></ul></div></div>
                <div class="tense-section"><h3>۳. حال کامل (Present Perfect)</h3><div class="tense-box"><h4>📌 ساختار:</h4><div class="structure">فاعل + have/has + p.p + متمم</div><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">I <strong>have finished</strong> my homework.</span><span class="ex-trans">(من تکالیفم را تمام کرده‌ام)</span></div></div></div><div class="tense-box"><h4>🎯 کاربردها:</h4><ul><li><strong>تجربه:</strong> <em>I have visited Mashhad three times.</em></li><li><strong>کار تمام‌شده با تأثیر در حال:</strong> <em>I have lost my keys.</em> (هنوز پیدا نشده)</li><li><strong>از گذشته تا حال:</strong> <em>I have lived here since 2010.</em></li></ul></div><div class="tense-box"><h4>⚠️ نکات کنکوری:</h4><ul><li><strong>قیدهای زمان:</strong> ever, never, already, yet, since, for, just</li><li><span class="highlight">تله تستی:</span> ❌ اشتباه: <em>I have seen him yesterday.</em> ✅ صحیح: <em>I saw him yesterday.</em> (با زمان مشخص، گذشته ساده)</li></ul></div></div>
                <div class="comparison-table"><h4>📊 جدول مقایسه‌ای زمان‌های حال</h4><table><thead><tr><th>زمان</th><th>ساختار</th><th>کاربرد</th></tr></thead><tbody><tr><td>حال ساده</td><td>فاعل + فعل (s/es)</td><td>عادت، حقیقت</td></tr><tr><td>حال استمراری</td><td>am/is/are + ing</td><td>کار در حال انجام</td></tr><tr><td>حال کامل</td><td>have/has + p.p</td><td>تجربه، نتیجه</td></tr></tbody></table></div>
                <div class="warning-box"><h4>❌ اشتباهات رایج:</h4><ul><li>❌ <em>I am knowing the answer.</em> → ✅ <em>I know the answer.</em></li><li>❌ <em>I have seen him yesterday.</em> → ✅ <em>I saw him yesterday.</em></li></ul></div>
                <div class="summary-box"><h4>✅ خلاصه ۳ نکته کلیدی:</h4><ul><li><strong>۱.</strong> حال ساده = عادت، حقیقت</li><li><strong>۲.</strong> حال استمراری = کار در حال انجام</li><li><strong>۳.</strong> حال کامل = تجربه، نتیجه</li></ul></div></div>`,
                tests: [
                    { year: "۱۴۰۴ نوبت اول", q: "The president will travel to the Hawaiian island .................... Monday to meet the mayor.", opts: "1) as  2) in  3) at  4) on", ans: "✅ گزینه ۴: on — برای روزهای هفته از <strong>on</strong> استفاده می‌شود.<br>❌ گزینه ۱ (as) برای نقش/مقایسه.<br>❌ گزینه ۲ (in) برای ماه‌ها/سال‌ها.<br>❌ گزینه ۳ (at) برای ساعت دقیق." },
                    { year: "۱۴۰۴ نوبت اول", q: "I ................... Mark this afternoon, and you haven't seen him for weeks. Why don't you come along?", opts: "1) meet  2) will have met  3) gonna meet  4) am meeting", ans: "✅ گزینه ۴: am meeting — برنامه‌ریزی شده برای آینده‌ای نزدیک با Present Continuous.<br>❌ گزینه ۱ (meet) حال ساده.<br>❌ گزینه ۲ (will have met) Future Perfect.<br>❌ گزینه ۳ (gonna meet) غیررسمی." },
                    { year: "۱۴۰۳ نوبت دوم", q: "Justice Jackson said in an interview published on Tuesday that she .................... the Jan. 5, 2022 rally in Berlin.", opts: "1) attending  2) will attend  3) would attended  4) attended", ans: "✅ گزینه ۴: attended — زمان گذشته ساده برای رویداد تمام‌شده در گذشته.<br>❌ گزینه ۱ (attending) بدون فعل کمکی.<br>❌ گزینه ۲ (will attend) آینده.<br>❌ گزینه ۳ (would attended) اشتباه." },
                    { year: "۱۴۰۱", q: "My sister is watching several episodes of her favorite comedy in a row. She .................... them all afternoon without a break.", opts: "1) watches  2) used to watch  3) is watching  4) has been watching", ans: "✅ گزینه ۴: has been watching — عملی که از گذشته شروع شده و تا حال ادامه دارد.<br>❌ گزینه ۱ (watches) حال ساده.<br>❌ گزینه ۲ (used to watch) عادت در گذشته.<br>❌ گزینه ۳ (is watching) در حال انجام." },
                    { year: "۱۴۰۱", q: "While Mary was in the library doing research, she .................... a book which contained letters the author had written to his son.", opts: "1) found  2) had found  3) had been finding  4) was finding", ans: "✅ گزینه ۱: found — یک عمل لحظه‌ای در گذشته.<br>❌ گزینه ۲ (had found) گذشته کامل.<br>❌ گزینه ۳ (had been finding) استمراری در گذشته دور.<br>❌ گزینه ۴ (was finding) استمراری." },
                    { year: "۱۴۰۰", q: "We had the volume turned down, so I couldn't make out what the characters in the film .................... about.", opts: "1) would be talking  2) had talked  3) have talked about  4) were talking", ans: "✅ گزینه ۴: were talking — Past Continuous برای عملی که در حال انجام در گذشته بوده.<br>❌ گزینه ۱ (would be talking) آینده در گذشته.<br>❌ گزینه ۲ (had talked) گذشته کامل.<br>❌ گزینه ۳ (have talked) Present Perfect." },
                    { year: "۱۴۰۰", q: ".................. for my mother living with me, I think I'd be quite lonely.", opts: "1) Were it not  2) If there was not  3) Whether or not it was  4) Not being", ans: "✅ گزینه ۱: Were it not — شرطی نوع دوم با وارونه‌سازی.<br>❌ گزینه ۲ (If there was not) was غلط.<br>❌ گزینه ۳ (Whether or not) عدم اهمیت.<br>❌ گزینه ۴ (Not being) ناقص." },
                    { year: "۱۴۰۳ نوبت اول", q: "What made him a great diplomat was that he could quote Cervantes's words about honesty even as he knew no one in the Hall believed in it, including himself.", opts: "1) such  2) so  3) too  4) very", ans: "✅ گزینه ۲: so — بعد از 'as he knew no one' به معنی 'به‌طوری که'.<br>❌ گزینه ۱ (such) قبل از اسم.<br>❌ گزینه ۳ (too) به معنی 'بیش از حد'.<br>❌ گزینه ۴ (very) قبل از صفت." },
                    { year: "۱۴۰۲ نوبت اول", q: "Although they don't need to be in absolutely tip-top shape, a reasonable level of fitness ................... to get the most from this course.", opts: "1) required for you  2) requires you  3) is required if you want  4) requirement is needed, in order", ans: "✅ گزینه ۳: is required if you want — ساختار مجهول + شرط.<br>❌ گزینه ۱ (required for you) ناقص.<br>❌ گزینه ۲ (requires you) فاعل مفرد است.<br>❌ گزینه ۴ (requirement is needed) اضافه‌گویی." },
                    { year: "۱۴۰۲ نوبت اول", q: "I ................... Mark this afternoon, and you haven't seen him for weeks. Why don't you come along?", opts: "1) meet  2) will have met  3) gonna meet  4) am meeting", ans: "✅ گزینه ۴: am meeting — برنامه‌ریزی شده برای آینده‌ای نزدیک.<br>❌ گزینه ۱ (meet) حال ساده.<br>❌ گزینه ۲ (will have met) Future Perfect.<br>❌ گزینه ۳ (gonna meet) غیررسمی." },
                    { year: "۱۴۰۲ نوبت دوم", q: "London is a very old city; some of its buildings, ..................., are very modern.", opts: "1) however  2) although  3) whereas  4) furthermore", ans: "✅ گزینه ۱: however — نشان‌دهنده تضاد.<br>❌ گزینه ۲ (although) باید جمله کامل.<br>❌ گزینه ۳ (whereas) برای مقایسه دو چیز.<br>❌ گزینه ۴ (furthermore) برای اضافه کردن مطلب." },
                    { year: "۱۴۰۲ نوبت دوم", q: "At first, he was reluctant, as he has always been a very private person, despite ................... in the public eye.", opts: "1) he used to be  2) being used to be  3) his used to being  4) being used to being", ans: "✅ گزینه ۴: being used to being — بعد از despite + gerund.<br>❌ گزینه ۱ (he used to be) جمله کامل.<br>❌ گزینه ۲ (being used to be) ترکیب نادرست.<br>❌ گزینه ۳ (his used to being) مالکیت اضافی." },
                    { year: "۱۴۰۲ نوبت دوم", q: "Google announced this week that it was launching an AI called Bard that will be integrated into its search engine .................... .", opts: "1) testing its after phase  2) after a testing phase  3) testing its phase after  4) after a phase is testing", ans: "✅ گزینه ۲: after a testing phase — ترتیب صحیح کلمات.<br>❌ گزینه ۱ (testing its after phase) ترتیب غلط.<br>❌ گزینه ۳ (testing its phase after) ترتیب غلط.<br>❌ گزینه ۴ (after a phase is testing) زمان اشتباه." },
                    { year: "۱۴۰۲ نوبت دوم", q: "No matter how ..................., it might be impossible for our bodies to go on forever.", opts: "1) technologically advanced gets  2) technology gets advance  3) advanced technology gets  4) advance gets technologically", ans: "✅ گزینه ۳: advanced technology gets — 'No matter how + صفت + فاعل + فعل'.<br>❌ گزینه ۱ (technologically advanced gets) ترتیب غلط.<br>❌ گزینه ۲ (technology gets advance) advance صفت نیست.<br>❌ گزینه ۴ (advance gets technologically) ترتیب غلط." },
                    { year: "۱۴۰۲ نوبت دوم", q: "I wish the agenda ................... at last night's meeting.", opts: "1) wasn’t changed  2) wouldn’t change  3) couldn’t be changed  4) hadn’t been changed", ans: "✅ گزینه ۴: hadn’t been changed — 'wish' برای گذشته + Past Perfect.<br>❌ گزینه ۱ (wasn't changed) برای حال.<br>❌ گزینه ۲ (wouldn't change) برای آینده.<br>❌ گزینه ۳ (couldn't be changed) امکان در گذشته." },
                    { year: "۱۴۰۲ نوبت دوم", q: "They are first taught the basic procedures for scuba diving, including safety and communication with fellow divers, ................... with the equipment before dipping their toes into the water.", opts: "1) and familiarized  2) who are familiarized  3) while they are familiarizing  4) then familiarize themselves", ans: "✅ گزینه ۴: then familiarize themselves — ترتیب منطقی وقایع.<br>❌ گزینه ۱ (and familiarized) بدون فاعل.<br>❌ گزینه ۲ (who are familiarized) موصولی اضافی.<br>❌ گزینه ۳ (while they are familiarizing) زمان حال." },
                    { year: "۱۴۰۲ نوبت دوم", q: "It was an artificial ecosystem of animals and crops, ................... large, uniform layout made western farms more efficient than the more- irregular farms in the East.", opts: "1) their  2) whose  3) as  4) which their", ans: "✅ گزینه ۲: whose — برای نشان دادن مالکیت.<br>❌ گزینه ۱ (their) ضمیر فاعلی.<br>❌ گزینه ۳ (as) به معنی 'به‌عنوان'.<br>❌ گزینه ۴ (which their) ترکیب نادرست." },
                    { year: "۱۴۰۲ نوبت دوم", q: "When I was in Tehran, I spent ...................., and I didn't even begin to see all of it.", opts: "1) a day to explore  2) an exploration day to  3) a day exploring  4) a day of exploration by", ans: "✅ گزینه ۳: a day exploring — spend + زمان + gerund.<br>❌ گزینه ۱ (a day to explore) بعد از spend نمی‌آید.<br>❌ گزینه ۲ (an exploration day to) ترتیب نادرست.<br>❌ گزینه ۴ (a day of exploration by) اضافه." },
                    { year: "۱۴۰۲ نوبت دوم", q: "One of the secrets of remaining in ................... choose a diet that is high in fiber and low in fat.", opts: "1) healthy is  2) healthy is to  3) good health is  4) good health is to", ans: "✅ گزینه ۴: good health is to — 'one of the secrets of remaining in good health is to choose'.<br>❌ گزینه ۱ (healthy is) 'healthy' صفت است.<br>❌ گزینه ۲ (healthy is to) صفت.<br>❌ گزینه ۳ (good health is) بدون 'to' ناقص." },
                    { year: "۱۴۰۲ نوبت دوم", q: "The scenery was wonderful. The costumes were marvelous. The cast were incredible. I wish ................... say the same about the script.", opts: "1) to  2) I could  3) I can  4) that I", ans: "✅ گزینه ۲: I could — 'I wish I could' آرزویی که در حال امکان‌پذیر نیست.<br>❌ گزینه ۱ (to) ناقص.<br>❌ گزینه ۳ (I can) نشان‌دهنده توانایی.<br>❌ گزینه ۴ (that I) ناقص." },
                    { year: "۱۴۰۲ نوبت دوم", q: "It has been said that Chinese papermakers were among the ................... near Samarqand.", opts: "1) prisoners who fought and captured in battle  2) prisoners fighting and captured in a battle  3) prisoners captured in a battle fought  4) captured prisoners in battle fight", ans: "✅ گزینه ۳: prisoners captured in a battle fought — ساختار خلاصه‌شده.<br>❌ گزینه ۱ (who fought and captured) زمان اشتباه.<br>❌ گزینه ۲ (fighting and captured) ترکیب نادرست.<br>❌ گزینه ۴ (captured prisoners in battle fight) بدون ربط." },
                    { year: "۱۴۰۲ نوبت دوم", q: "Parents are welcome to watch as their children learn to scuba dive and enjoy ................... underwater.", opts: "1) to make bubbles in  2) making bubbles  3) bubbles that are in  4) bubbles to be", ans: "✅ گزینه ۲: making bubbles — بعد از enjoy + gerund.<br>❌ گزینه ۱ (to make bubbles in) to + مصدر.<br>❌ گزینه ۳ (bubbles that are in) جمله وصفی اضافی.<br>❌ گزینه ۴ (bubbles to be) ناقص." },
                    { year: "۱۴۰۲ نوبت دوم", q: "To better understand how people form their identities online, researchers combed through 2.5 million selfie posts to determine what kinds of identity statements ................... and sharing the photos.", opts: "1) do people make by taking  2) do people make to take  3) people make by taking  4) people make to take", ans: "✅ گزینه ۳: people make by taking — ساختار خبری.<br>❌ گزینه ۱ (do people make) سوالی.<br>❌ گزینه ۲ (do people make to take) سوالی.<br>❌ گزینه ۴ (people make to take) 'by' صحیح‌تر است." }
                ]

            {
                id: "conditionals",
                icon: "🔀",
                label: "شرطی‌ها",
                title: "شرطی‌ها (Conditionals)",
                lesson: `<div class="lesson-full"><p class="intro"><strong>شرطی‌ها</strong> از پرکاربردترین مباحث گرامر کنکور هستند. <span class="stat-badge">حدود ۲۰٪ سوالات گرامر</span> به شرطی‌ها اختصاص دارد.</p>
                <div class="tense-section"><h3>۱. شرطی نوع صفر</h3><div class="tense-box"><h4>📌 ساختار:</h4><div class="structure">If + Present Simple, ... Present Simple</div><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">If you <strong>heat</strong> water, it <strong>boils</strong>.</span><span class="ex-trans">(اگر آب را گرم کنی، می‌جوشد)</span></div></div></div><div class="tense-box"><h4>🎯 کاربرد:</h4><ul><li><strong>حقایق علمی:</strong> <em>If you heat water, it boils.</em></li></ul></div></div>
                <div class="tense-section"><h3>۲. شرطی نوع اول</h3><div class="tense-box"><h4>📌 ساختار:</h4><div class="structure">If + Present Simple, ... Future Simple (will)</div><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">If it <strong>rains</strong>, I <strong>will stay</strong> home.</span><span class="ex-trans">(اگر باران ببارد، خانه می‌مانم)</span></div></div></div><div class="tense-box"><h4>🎯 کاربرد:</h4><ul><li><strong>احتمال وقوع در آینده:</strong> <em>If it rains, I will stay home.</em></li></ul></div><div class="tense-box"><h4>⚠️ نکته:</h4><ul><li><span class="highlight">در جمله شرطی هرگز از will استفاده نمی‌شود.</span></li><li><span class="highlight">تله تستی:</span> ❌ اشتباه: <em>If I will see him...</em> ✅ صحیح: <em>If I see him...</em></li></ul></div></div>
                <div class="tense-section"><h3>۳. شرطی نوع دوم</h3><div class="tense-box"><h4>📌 ساختار:</h4><div class="structure">If + Past Simple, ... would + infinitive</div><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">If I <strong>were</strong> rich, I <strong>would travel</strong> the world.</span><span class="ex-trans">(اگر پولدار بودم، دنیا را سفر می‌کردم)</span></div></div></div><div class="tense-box"><h4>🎯 کاربرد:</h4><ul><li><strong>خلاف واقع در حال:</strong> <em>If I were rich, I would travel.</em></li></ul></div><div class="tense-box"><h4>⚠️ نکته:</h4><ul><li><span class="highlight">همیشه از were برای همه اشخاص استفاده می‌شود.</span></li><li><span class="highlight">تله تستی:</span> ❌ اشتباه: <em>If I was rich...</em> ✅ صحیح: <em>If I were rich...</em></li></ul></div></div>
                <div class="tense-section"><h3>۴. شرطی نوع سوم</h3><div class="tense-box"><h4>📌 ساختار:</h4><div class="structure">If + Past Perfect, ... would have + p.p</div><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">If I <strong>had known</strong>, I <strong>would have come</strong>.</span><span class="ex-trans">(اگر می‌دانستم، می‌آمدم)</span></div></div></div><div class="tense-box"><h4>🎯 کاربرد:</h4><ul><li><strong>خلاف واقع در گذشته:</strong> <em>If I had known, I would have come.</em></li></ul></div></div>
                <div class="comparison-table"><h4>📊 جدول مقایسه‌ای شرطی‌ها</h4><table><thead><tr><th>نوع</th><th>شرط</th><th>نتیجه</th><th>کاربرد</th></tr></thead><tbody><tr><td>صفر</td><td>Present Simple</td><td>Present Simple</td><td>حقیقت علمی</td></tr><tr><td>اول</td><td>Present Simple</td><td>will</td><td>احتمال در آینده</td></tr><tr><td>دوم</td><td>Past Simple</td><td>would</td><td>خلاف واقع در حال</td></tr><tr><td>سوم</td><td>Past Perfect</td><td>would have</td><td>خلاف واقع در گذشته</td></tr></tbody></table></div>
                <div class="warning-box"><h4>❌ اشتباهات رایج:</h4><ul><li>❌ <em>If I was rich...</em> → ✅ <em>If I were rich...</em></li><li>❌ <em>If I will see him...</em> → ✅ <em>If I see him...</em></li></ul></div>
                <div class="summary-box"><h4>✅ خلاصه ۳ نکته کلیدی:</h4><ul><li><strong>۱.</strong> نوع صفر = حقیقت علمی</li><li><strong>۲.</strong> نوع اول = احتمال آینده</li><li><strong>۳.</strong> نوع دوم/سوم = خلاف واقع</li></ul></div></div>`,
                tests: [
                    { year: "۱۴۰۳ نوبت دوم", q: "If I were to propose love as the law of Zimbabwe, those critics .................... something wrong with it.", opts: "1) have found  2) will find  3) would find  4) find", ans: "✅ گزینه ۳: would find — شرطی نوع دوم.<br>❌ گزینه ۱ (have found) حال کامل.<br>❌ گزینه ۲ (will find) نوع اول.<br>❌ گزینه ۴ (find) حال ساده." },
                    { year: "۱۴۰۱", q: "I was lucky my noisy guests finally quieted down. Otherwise, the neighbors .................... the police.", opts: "1) had called  2) had to call  3) would call  4) would have called", ans: "✅ گزینه ۴: would have called — شرطی نوع سوم با Otherwise.<br>❌ گزینه ۱ (had called) گذشته کامل.<br>❌ گزینه ۲ (had to call) مجبور بودند.<br>❌ گزینه ۳ (would call) نوع دوم." },

                <div class="tense-section"><h3>۱. تعریف</h3><div class="tense-box"><h4>📌 Gerund:</h4><div class="structure">فعل + ing (به عنوان اسم)</div><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text"><strong>Swimming</strong> is fun.</span><span class="ex-trans">(شنا کردن لذت‌بخش است)</span></div></div></div><div class="tense-box"><h4>📌 Infinitive:</h4><div class="structure">to + فعل</div><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">I want <strong>to swim</strong>.</span><span class="ex-trans">(می‌خواهم شنا کنم)</span></div></div></div></div>

                <div class="tense-section"><h3>۱. ضمایر موصولی</h3><div class="tense-box"><h4>📌 ضمایر:</h4><ul><li><strong>who:</strong> افراد (فاعل) — <em>... those who love you.</em></li><li><strong>which:</strong> اشیاء و حیوانات — <em>... the process by which ...</em></li><li><strong>that:</strong> برای همه — <em>... the book that I read.</em></li><li><strong>whose:</strong> مالکیت — <em>... the man whose car was stolen.</em></li></ul><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">The man <strong>who</strong> called you is my brother.</span><span class="ex-trans">(مردی که با تو تماس گرفت برادر من است)</span></div><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">The book <strong>which</strong> I bought is interesting.</span><span class="ex-trans">(کتابی که خریدم جالب است)</span></div></div></div><div class="tense-box"><h4>⚠️ نکته:</h4><ul><li>بعد از <strong>حرف اضافه</strong> فقط <strong>whom</strong> و <strong>which</strong> می‌آیند، نه that.</li><li><span class="highlight">تله تستی:</span> ❌ اشتباه: <em>The man that I spoke to him.</em> ✅ صحیح: <em>The man to whom I spoke.</em></li></ul></div></div>

                label: "وجه وصفی",
                title: "وجه وصفی (Participles)",
                lesson: `<div class="lesson-full"><p class="intro"><strong>وجه وصفی</strong> یکی از مباحث مهم و پرکاربرد در جملات انگلیسی است.</p>
                <div class="tense-section"><h3>۱. انواع وجه وصفی</h3><div class="tense-box"><h4>📌 Present Participle (ing):</h4><ul><li><strong>حالت فعال:</strong> <em>The man standing there is my father.</em></li></ul><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">The man <strong>standing</strong> there is my father.</span><span class="ex-trans">(مردی که آنجا ایستاده پدر من است)</span></div></div></div><div class="tense-box"><h4>📌 Past Participle (p.p):</h4><ul><li><strong>حالت مجهول:</strong> <em>The book written by him is famous.</em></li></ul><div class="example-list"><div class="example-item"><span class="ex-num">مثال:</span><span class="ex-text">The book <strong>written</strong> by him is famous.</span><span class="ex-trans">(کتابی که توسط او نوشته شده معروف است)</span></div></div></div></div>
                <div class="tense-box"><h4>⚠️ نکته:</h4><ul><li>فعال → Present Participle (ing)</li><li>مجهول → Past Participle (p.p)</li><li><span class="highlight">تله تستی:</span> ❌ اشتباه: <em>The man is standing there is my father.</em> ✅ صحیح: <em>The man standing there is my father.</em></li></ul></div>
                <div class="summary-box"><h4>✅ خلاصه ۳ نکته کلیدی:</h4><ul><li><strong>۱.</strong> Present Participle = فعال</li><li><strong>۲.</strong> Past Participle = مجهول</li><li><strong>۳.</strong> به جای جمله وصفی استفاده می‌شوند.</li></ul></div></div>`,
                tests: [
                    { year: "۱۴۰۰", q: "Persuading staff to accept new patterns of work is a challenge .................... by many companies that want to develop.", opts: "1) has been faced  2) which faced  3) it is faced  4) faced", ans: "✅ گزینه ۴: faced — Past Participle به عنوان صفت برای جمله مجهول.<br>❌ گزینه ۱ (has been faced) حال کامل.<br>❌ گزینه ۲ (which faced) موصولی.<br>❌ گزینه ۳ (it is faced) جمله کامل." },
                    { year: "۱۴۰۴ نوبت اول", q: "The idea of this approach is to use different levels of modeling, .................... to study phenomena at a certain length scale.", opts: "1) each designed  2) both designing  3) which designed  4) that designing", ans: "✅ گزینه ۱: each designed — ساختار با Past Participle (مجهول).<br>❌ گزینه ۲ (both designing) فعال.<br>❌ گزینه ۳ (which designed) زمان گذشته.<br>❌ گزینه ۴ (that designing) ناقص." },
                    { year: "۱۴۰۳ نوبت دوم", q: "After being arrested, most juveniles are released to their parents, .................... charged with serious crimes.", opts: "1) but being  2) unless they are  3) contrary to those are  4) except being", ans: "✅ گزینه ۲: unless they are — 'unless they are charged'.<br>❌ گزینه ۱ (but being) ناقص.<br>❌ گزینه ۳ (contrary to those are) نادرست.<br>❌ گزینه ۴ (except being) ناقص." },
                    { year: "۱۴۰۴ نوبت اول", q: "The technology of neuroscience is .................... to genetically engineer insect brains.", opts: "1) enough advanced  2) advanced enough  3) such advanced that  4) advanced such that", ans: "✅ گزینه ۲: advanced enough — 'صفت + enough + to'.<br>❌ گزینه ۱ (enough advanced) ترتیب غلط.<br>❌ گزینه ۳ (such advanced that) such قبل از اسم.<br>❌ گزینه ۴ (advanced such that) نادرست." }
                ]
            }
        ];
        
        // ============================================
        // ساخت دکمه‌های منو
        // ============================================
        const menuContainer = document.getElementById('menuContainer');
        const menuGrid = document.getElementById('menuGrid');
        const contentContainer = document.getElementById('contentContainer');
        const skeletonContainer = document.getElementById('skeletonContainer');
        
        topics.forEach(topic => {
            const btn = document.createElement('button');
            btn.className = 'btn-section';
            btn.dataset.id = topic.id;
            btn.setAttribute('role', 'button');
            btn.setAttribute('aria-label', `مشاهده مبحث ${topic.label}`);
            btn.innerHTML = `<span class="icon">${topic.icon}</span> ${topic.label}`;
            btn.addEventListener('click', () => showTopic(topic.id));
            menuGrid.appendChild(btn);
        });
        
        // ============================================
        // نمایش مبحث
        // ============================================
        function showTopic(id) {
            const topic = topics.find(t => t.id === id);
            if (!topic) return;
            
            menuContainer.classList.add('hidden');
            skeletonContainer.classList.add('active');
            contentContainer.classList.remove('open');
            
            setTimeout(() => {
                skeletonContainer.classList.remove('active');
                renderContent(topic);
                contentContainer.classList.add('open');
                contentContainer.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }, 400);
        }
        
        // ============================================
        // بازگشت به منو
        // ============================================
        function goBackToMenu() {
            contentContainer.classList.remove('open');
            contentContainer.innerHTML = '';
            menuContainer.classList.remove('hidden');
            menuContainer.scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start' 
            });
        }
        
        // ============================================
        // رندر محتوا
        // ============================================
        function renderContent(topic) {
            while (contentContainer.firstChild) {
                contentContainer.removeChild(contentContainer.firstChild);
            }
            
            const backBtn = document.createElement('button');
            backBtn.className = 'back-btn';
            backBtn.setAttribute('role', 'button');
            backBtn.setAttribute('aria-label', 'بازگشت به منو');
            backBtn.textContent = '↩ بازگشت به منو';
            backBtn.addEventListener('click', goBackToMenu);
            contentContainer.appendChild(backBtn);
            
            const lessonDiv = document.createElement('div');
            lessonDiv.innerHTML = topic.lesson;
            contentContainer.appendChild(lessonDiv);
            
            if (topic.tests && topic.tests.length > 0) {
                const testsTitle = document.createElement('h3');
                testsTitle.textContent = `🎯 تست‌های کنکور (${topic.tests.length} تست)`;
                testsTitle.style.cssText = 'font-size: 18px; color: var(--primary); margin: 24px 0 16px; padding-right: 12px; border-right: 4px solid var(--gold);';
                contentContainer.appendChild(testsTitle);
                
                topic.tests.forEach((test, index) => {
                    const testItem = document.createElement('div');
                    testItem.className = 'test-item';
                    
                    const tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.textContent = test.year;
                    testItem.appendChild(tag);
                    
                    const q = document.createElement('div');
                    q.className = 'q';
                    q.textContent = `${index + 1}. ${test.q}`;
                    testItem.appendChild(q);
                    
                    const opts = document.createElement('div');
                    opts.className = 'options';
                    opts.textContent = test.opts;
                    testItem.appendChild(opts);
                    
                    const btn = document.createElement('button');
                    btn.className = 'btn-answer';
                    btn.setAttribute('role', 'button');
                    btn.setAttribute('aria-label', `مشاهده پاسخ تشریحی سوال ${index + 1}`);
                    btn.setAttribute('aria-expanded', 'false');
                    btn.textContent = '👁️ نمایش پاسخ';
                    
                    const answerBox = document.createElement('div');
                    answerBox.className = 'answer-box';
                    answerBox.setAttribute('role', 'region');
                    answerBox.setAttribute('aria-live', 'polite');
                    
                    const answerText = document.createElement('div');
                    answerText.innerHTML = `<strong>پاسخ تشریحی:</strong><br>${test.ans}`;
                    answerBox.appendChild(answerText);
                    
                    btn.addEventListener('click', () => {
                        const isOpen = answerBox.classList.contains('open');
                        if (isOpen) {
                            answerBox.classList.remove('open');
                            btn.textContent = '👁️ نمایش پاسخ';
                            btn.setAttribute('aria-expanded', 'false');
                        } else {
                            answerBox.classList.add('open');
                            btn.textContent = '🔒 مخفی کردن پاسخ';
                            btn.setAttribute('aria-expanded', 'true');
                        }
                    });
                    
                    testItem.appendChild(btn);
                    testItem.appendChild(answerBox);
                    contentContainer.appendChild(testItem);
                });
            }
        }
        
        // ============================================
        // بارگذاری اولیه (فقط نمایش منو)
        // ============================================
        window.onload = function() {
            menuContainer.classList.remove('hidden');
            contentContainer.classList.remove('open');
            contentContainer.innerHTML = '';
            skeletonContainer.classList.remove('active');
        };
        
        // ============================================
        // Service Worker
        // ============================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/konkur-grammar/sw.js')
                .then(() => console.log('✅ Service Worker registered'))
                .catch((err) => console.error('❌ Service Worker failed:', err));
        }
    </script>
</body>
</html>

    <style>
        /* ============================================

           ============================================ */
        :root {

        .btn-section {
            background: white;
            border: none;
            border-radius: var(--radius);
            padding: 16px 8px;

            box-shadow: var(--shadow);
            transition: 0.25s ease;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;

            box-shadow: 0 10px 28px rgba(0,0,0,0.10);
            background: #f8fafc;
        }
        
        .btn-section:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }
        
        /* ============================================
           Skeleton Screen
           ============================================ */
        .skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        #skeletonContainer {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
        }
        
        #skeletonContainer.active {
            display: block;
        }
        
        /* ============================================
           محتوای اصلی
           ============================================ */
        #contentContainer {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            animation: fadeUp 0.35s ease;
        }
        
        #contentContainer.open {
            display: block;
        }
        
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }

           دکمه بازگشت

    <div class="container">

    <script>
        'use strict';
        
        // ============================================
        // داده‌های کامل با درسنامه‌های عمیق (۹ مبحث)
        // ============================================
        const topics = [
            {
                id: "tenses",
                icon: "⏰",
                label: "زمان‌ها",
                title: "زمان‌ها (Tenses)",
                lesson: `
                    <div class="lesson-full">
                        <p class="intro">
                            <strong>زمان‌ها</strong> ستون اصلی گرامر انگلیسی هستند. 
                            <span class="stat-badge">حدود ۳۰٪ سوالات گرامر کنکور</span> به زمان‌ها اختصاص دارد.
                            درک درست آنها، گام اول برای تسلط بر گرامر است.
                        </p>
                        
                        <!-- ============================================
                         مبحث ۱: حال ساده
                         ============================================ -->
                        <div class="tense-section">
                            <h3>۱. حال ساده (Simple Present)</h3>
                            
                            <div class="tense-box">
                                <h4>📌 ساختار:</h4>
                                <div class="structure">فاعل + فعل (s/es برای سوم شخص مفرد) + متمم</div>
                                <div class="structure">I/You/We/They → work &bull; He/She/It → works</div>
                            </div>
                            
                            <div class="tense-box">
                                <h4>🎯 کاربردها:</h4>
                                <ul>
                                    <li><strong>حقایق علمی و کلی:</strong> <em>The sun rises in the east.</em> (خورشید از شرق طلوع می‌کند)</li>
                                    <li><strong>عادت‌ها و کارهای تکراری:</strong> <em>I drink coffee every morning.</em> (هر روز صبح قهوه می‌نوشم)</li>
                                    <li><strong>برنامه‌های ثابت:</strong> <em>The train leaves at 6 PM.</em> (قطار ساعت ۶ حرکت می‌کند)</li>
                                    <li><strong>حالات و احساسات:</strong> <em>I love this movie.</em> (این فیلم را دوست دارم)</li>
                                </ul>
                            </div>
                            
                            <div class="tense-box">
                                <h4>⚠️ نکات کنکوری:</h4>
                                <ul>
                                    <li><strong>قیدهای زمان:</strong> always, usually, often, sometimes, never, every day</li>
                                    <li><strong>تله تستی:</strong> وقتی جمله با <em>every day</em> یا <em>always</em> همراه باشد، حال ساده استفاده می‌شود.</li>
                                    <li><strong>استثنا:</strong> فعل <em>to be</em> در حال ساده: <em>am/is/are</em></li>
                                </ul>
                            </div>
                            
                            <div class="example-list">
                                <div class="example-item">
                                    <span class="ex-num">۱.</span>
                                    <span class="ex-text">Water <strong>boils</strong> at 100°C.</span>
                                    <span class="ex-trans">(آب در ۱۰۰ درجه می‌جوشد) → حقیقت علمی</span>
                                </div>
                                <div class="example-item">
                                    <span class="ex-num">۲.</span>

                            <ul>
                                <li>❌ <em>The book was wrote by him.</em> → ✅ <em>The book was written by him.</em> (p.p = written)</li>
                                <li>❌ <em>She is married with him.</em> → ✅ <em>She is married to him.</em> (حرف اضافه اشتباه)</li>
                            </ul>
                        </div>
                        
                        <!-- ============================================
                         خلاصه
                         ============================================ -->
                        <div class="summary-box">
                            <h4>✅ خلاصه ۳ نکته کلیدی:</h4>
                            <ul>
                                <li><strong>۱.</strong> مجهول = مفعول + be (در زمان مناسب) + p.p</li>
                                <li><strong>۲.</strong> فقط افعال متعدی (با مفعول) مجهول می‌شوند.</li>
                                <li><strong>۳.</strong> در مجهول، زمان فعل با <em>be</em> مشخص می‌شود.</li>
                            </ul>
                        </div>
                    </div>
                `,
                tests: [ /* تست‌ها */ ]
            }
            // مباحث ۴ تا ۹ با همین الگو (برای جلوگیری از طولانی شدن کد، در نسخه کامل اضافه می‌شوند)
        ];
        
        // ============================================
        // رفرنس به المان‌های DOM
        // ============================================
        const menuContainer = document.getElementById('menuContainer');
        const menuGrid = document.getElementById('menuGrid');
        const contentContainer = document.getElementById('contentContainer');
        const skeletonContainer = document.getElementById('skeletonContainer');
        
        // ============================================
        // ساخت دکمه‌های منو
        // ============================================
        topics.forEach(topic => {
            const btn = document.createElement('button');
            btn.className = 'btn-section';
            btn.dataset.id = topic.id;
            btn.setAttribute('role', 'button');
            btn.setAttribute('aria-label', `مشاهده مبحث ${topic.label}`);
            btn.innerHTML = `<span class="icon">${topic.icon}</span> ${topic.label}`;
            btn.addEventListener('click', () => showTopic(topic.id));
            menuGrid.appendChild(btn);
        });
        
        // ============================================
        // نمایش مبحث
        // ============================================
        function showTopic(id) {
            const topic = topics.find(t => t.id === id);
            if (!topic) return;
            
            menuContainer.classList.add('hidden');
            skeletonContainer.classList.add('active');
            contentContainer.classList.remove('open');
            
            setTimeout(() => {
                skeletonContainer.classList.remove('active');
                renderContent(topic);
                contentContainer.classList.add('open');
                contentContainer.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }, 400);
        }
        
        // ============================================
        // بازگشت به منو
        // ============================================
        function goBackToMenu() {
            contentContainer.classList.remove('open');
            contentContainer.innerHTML = '';
            menuContainer.classList.remove('hidden');
            menuContainer.scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start' 
            });
        }
        
        // ============================================
        // رندر محتوا
        // ============================================
        function renderContent(topic) {
            while (contentContainer.firstChild) {
                contentContainer.removeChild(contentContainer.firstChild);
            }
            
            const backBtn = document.createElement('button');
            backBtn.className = 'back-btn';
            backBtn.setAttribute('role', 'button');
            backBtn.setAttribute('aria-label', 'بازگشت به منو');
            backBtn.textContent = '↩ بازگشت به منو';
            backBtn.addEventListener('click', goBackToMenu);
            contentContainer.appendChild(backBtn);
            
            // درسنامه (با innerHTML امن چون محتوای ثابت است)
            const lessonDiv = document.createElement('div');
            lessonDiv.innerHTML = topic.lesson;
            contentContainer.appendChild(lessonDiv);
            
            // تست‌ها
            if (topic.tests && topic.tests.length > 0) {
                const testsTitle = document.createElement('h3');
                testsTitle.textContent = `🎯 تست‌های کنکور (${topic.tests.length} تست)`;
                testsTitle.style.cssText = 'font-size: 18px; color: var(--primary); margin: 24px 0 16px; padding-right: 12px; border-right: 4px solid var(--gold);';
                contentContainer.appendChild(testsTitle);
                
                topic.tests.forEach((test, index) => {
                    const testItem = document.createElement('div');
                    testItem.className = 'test-item';
                    
                    const tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.textContent = test.year;
                    testItem.appendChild(tag);
                    
                    const q = document.createElement('div');
                    q.className = 'q';
                    q.textContent = `${index + 1}. ${test.q}`;
                    testItem.appendChild(q);
                    
                    const opts = document.createElement('div');
                    opts.className = 'options';
                    opts.textContent = test.opts;
                    testItem.appendChild(opts);
                    
                    const btn = document.createElement('button');
                    btn.className = 'btn-answer';
                    btn.setAttribute('role', 'button');
                    btn.setAttribute('aria-label', `مشاهده پاسخ تشریحی سوال ${index + 1}`);
                    btn.setAttribute('aria-expanded', 'false');
                    btn.textContent = '👁️ نمایش پاسخ';
                    
                    const answerBox = document.createElement('div');
                    answerBox.className = 'answer-box';
                    answerBox.setAttribute('role', 'region');
                    answerBox.setAttribute('aria-live', 'polite');
                    
                    const answerText = document.createElement('div');
                    answerText.innerHTML = `<strong>پاسخ تشریحی:</strong><br>${test.ans}`;
                    answerBox.appendChild(answerText);
                    
                    btn.addEventListener('click', () => {
                        const isOpen = answerBox.classList.contains('open');
                        if (isOpen) {
                            answerBox.classList.remove('open');
                            btn.textContent = '👁️ نمایش پاسخ';
                            btn.setAttribute('aria-expanded', 'false');
                        } else {
                            answerBox.classList.add('open');
                            btn.textContent = '🔒 مخفی کردن پاسخ';
                            btn.setAttribute('aria-expanded', 'true');
                        }
                    });
                    
                    testItem.appendChild(btn);
                    testItem.appendChild(answerBox);
                    contentContainer.appendChild(testItem);
                });
            }
        }
        
        // ============================================
        // بارگذاری اولیه (مبحث اول)
        // ============================================
        window.onload = function() {
            showTopic('tenses');
        };
        
        // ============================================
        // Service Worker
        // ============================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/konkur-grammar/sw.js')
                .then(() => console.log('✅ Service Worker registered'))
                .catch((err) => console.error('❌ Service Worker failed:', err));
        }
    </script>
</body>
</html>

    <style>
        /* ============================================
           تغییر ۶: اصلاح تم رنگی (آبی نفتی/طلایی)
           تغییر ۱۰: حذف !important های غیرضروری

        :root {
            --primary: #0f2b4b;
            --primary-light: #1a4a7a;
            --gold: #c9a84c;
            --gold-light: #ffd966;
            --bg: #f4f6f9;
            --text: #1e293b;
            --radius: 16px;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Vazir', 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            direction: rtl;
            padding: 16px 12px 40px;
        }
        
        .container {
            max-width: 800px;

        /* ============================================
           هدر
           ============================================ */
        .header {
            text-align: center;
            padding: 20px 0 10px;
        }
        
        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        
        .header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 4px;
        }
        
        /* ============================================
           تغییر ۳: اصلاح تعداد تست‌ها

        .header .badge {

            color: var(--primary);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 8px;
        }
        
        /* ============================================
           دکمه‌های منو
           ============================================ */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin: 20px 0 30px;
        }
        
        .btn-section {
            background: white;
            border: none;
            border-radius: var(--radius);
            padding: 16px 8px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: 0.25s ease;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        
        .btn-section .icon {
            font-size: 28px;
            color: var(--primary-light);
        }
        
        .btn-section:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.10);
            background: #f8fafc;
        }
        
        .btn-section.active {
            background: var(--primary);
            color: white;
        }
        
        .btn-section.active .icon {
            color: var(--gold-light);
        }
        
        /* ============================================
           تغییر ۸: ساختار سمنتیک
           ============================================ */
        .content-box {

        }
        
        @keyframes fadeUp {

        .content-box h2 {

        .content-box h3 {

        .content-box p,

        .tag {

                width: 100%;
                justify-content: center;
                padding: 12px;
            }
            .header h1 {
                font-size: 20px;
            }
        }

    <script>
        // ============================================
        // داده‌های کامل (۹ مبحث، ۹۰ تست)
        // ============================================
        const data = [{
            id: "tenses",
            icon: "⏰",
            label: "زمان‌ها",
            title: "زمان‌ها (Tenses)",
            lesson: `
                <p>زمان‌ها ستون اصلی گرامر انگلیسی‌اند. در کنکور، این ۶ زمان بیشترین کاربرد را دارند:</p>
                <ul>
                    <li><strong>Simple Present:</strong> عادات، حقایق علمی، برنامه‌های ثابت. <br>مثال: <em>The sun rises in the east.</em></li>
                    <li><strong>Present Continuous:</strong> کار در حال انجام الان، برنامه‌های نزدیک. <br>مثال: <em>I am meeting Mark this afternoon.</em></li>
                    <li><strong>Simple Past:</strong> کار تمام‌شده در گذشته. <br>مثال: <em>She attended the rally.</em></li>
                    <li><strong>Past Continuous:</strong> کار در حال انجام در گذشته. <br>مثال: <em>I was watching TV when he called.</em></li>
                    <li><strong>Present Perfect:</strong> تجربه، کار تمام‌شده با تاثیر حال، از گذشته تا حال. <br>مثال: <em>I have gained a lot of experience.</em></li>
                    <li><strong>Future:</strong> will / going to / Present Continuous برای آینده.</li>
                </ul>
                <div class="example-box">
                    <strong>💡 نکته طلایی:</strong> در تست‌ها، به <strong>قید زمان</strong> (now, yesterday, since, for, ...) و <strong>توالی وقایع</strong> دقت کنید.
                </div>
            `,
            tests: [
                { year: "۱۴۰۴ نوبت اول", q: "The president will travel to the Hawaiian island .................... Monday to meet the mayor.", opts: "1) as  2) in  3) at  4) on", ans: "✅ گزینه ۴: on — برای روزهای هفته از <strong>on</strong> استفاده می‌شود.<br>❌ گزینه ۱ (as) برای نقش/مقایسه به کار می‌رود.<br>❌ گزینه ۲ (in) برای ماه‌ها/سال‌ها.<br>❌ گزینه ۳ (at) برای ساعت دقیق." },
                { year: "۱۴۰۴ نوبت اول", q: "I ................... Mark this afternoon, and you haven't seen him for weeks. Why don't you come along?", opts: "1) meet  2) will have met  3) gonna meet  4) am meeting", ans: "✅ گزینه ۴: am meeting — برنامه‌ریزی شده برای آینده‌ای نزدیک با Present Continuous.<br>❌ گزینه ۱ (meet) حال ساده برای برنامه ثابت.<br>❌ گزینه ۲ (will have met) Future Perfect برای عملی که تا زمان خاصی در آینده تمام می‌شود.<br>❌ گزینه ۳ (gonna meet) غیررسمی و برای کنکور مناسب نیست." },
                { year: "۱۴۰۳ نوبت دوم", q: "Justice Jackson said in an interview published on Tuesday that she .................... the Jan. 5, 2022 rally in Berlin.", opts: "1) attending  2) will attend  3) would attended  4) attended", ans: "✅ گزینه ۴: attended — زمان گذشته ساده برای رویداد تمام‌شده در گذشته با تاریخ مشخص.<br>❌ گزینه ۱ (attending) بدون فعل کمکی.<br>❌ گزینه ۲ (will attend) آینده، اما تاریخ ۲۰۲۲ گذشته است.<br>❌ گزینه ۳ (would attended) would + past participle اشتباه است." },
                { year: "۱۴۰۱", q: "My sister is watching several episodes of her favorite comedy in a row. She .................... them all afternoon without a break.", opts: "1) watches  2) used to watch  3) is watching  4) has been watching", ans: "✅ گزینه ۴: has been watching — عملی که از گذشته شروع شده و تا حال ادامه دارد و هنوز تمام نشده.<br>❌ گزینه ۱ (watches) حال ساده برای عادت.<br>❌ گزینه ۲ (used to watch) عادت در گذشته که تمام شده.<br>❌ گزینه ۳ (is watching) در حال انجام الان، اما all afternoon نشان‌دهنده مدت زمان است." },
                { year: "۱۴۰۱", q: "While Mary was in the library doing research, she .................... a book which contained letters the author had written to his son.", opts: "1) found  2) had found  3) had been finding  4) was finding", ans: "✅ گزینه ۱: found — یک عمل لحظه‌ای در گذشته که در حین عمل دیگر (was doing research) رخ داده.<br>❌ گزینه ۲ (had found) قبل از عمل دیگر در گذشته، اما او در حال انجام کار بوده.<br>❌ گزینه ۳ (had been finding) استمراری در گذشته دور.<br>❌ گزینه ۴ (was finding) استمراری، اما پیدا کردن لحظه‌ای است." },
                { year: "۱۴۰۰", q: "We had the volume turned down, so I couldn't make out what the characters in the film .................... about.", opts: "1) would be talking  2) had talked  3) have talked about  4) were talking", ans: "✅ گزینه ۴: were talking — Past Continuous برای عملی که در حال انجام در گذشته بوده و ما نشنیدیم.<br>❌ گزینه ۱ (would be talking) آینده در گذشته.<br>❌ گزینه ۲ (had talked) گذشته کامل، قبل از عمل دیگر.<br>❌ گزینه ۳ (have talked) Present Perfect، مربوط به حال است." },
                { year: "۱۴۰۰", q: ".................. for my mother living with me, I think I'd be quite lonely.", opts: "1) Were it not  2) If there was not  3) Whether or not it was  4) Not being", ans: "✅ گزینه ۱: Were it not — شرطی نوع دوم با وارونه‌سازی (حذف if).<br>❌ گزینه ۲ (If there was not) صحیح نیست چون در شرطی نوع دوم از were استفاده می‌شود.<br>❌ گزینه ۳ (Whether or not) برای نشان دادن عدم اهمیت.<br>❌ گزینه ۴ (Not being) ساختار ناقص." },
                { year: "۱۴۰۳ نوبت اول", q: "What made him a great diplomat was that he could quote Cervantes's words about honesty even as he knew no one in the Hall believed in it, including himself.", opts: "1) such  2) so  3) too  4) very", ans: "✅ گزینه ۲: so — بعد از 'as he knew no one' به معنی 'به‌طوری که' از so استفاده می‌شود.<br>❌ گزینه ۱ (such) قبل از اسم می‌آید.<br>❌ گزینه ۳ (too) به معنی 'بیش از حد'.<br>❌ گزینه ۴ (very) قبل از صفت می‌آید." },
                { year: "۱۴۰۲ نوبت اول", q: "Although they don't need to be in absolutely tip-top shape, a reasonable level of fitness ................... to get the most from this course.", opts: "1) required for you  2) requires you  3) is required if you want  4) requirement is needed, in order", ans: "✅ گزینه ۳: is required if you want — ساختار مجهول + شرط.<br>❌ گزینه ۱ (required for you) ناقص.<br>❌ گزینه ۲ (requires you) فاعل 'a reasonable level' مفرد است اما requires you معنی نمی‌دهد.<br>❌ گزینه ۴ (requirement is needed) اضافه‌گویی." },
                { year: "۱۴۰۲ نوبت اول", q: "I ................... Mark this afternoon, and you haven't seen him for weeks. Why don't you come along?", opts: "1) meet  2) will have met  3) gonna meet  4) am meeting", ans: "✅ گزینه ۴: am meeting — برنامه‌ریزی شده برای آینده‌ای نزدیک.<br>❌ گزینه ۱ (meet) حال ساده.<br>❌ گزینه ۲ (will have met) Future Perfect.<br>❌ گزینه ۳ (gonna meet) غیررسمی." },
                { year: "۱۴۰۲ نوبت دوم", q: "London is a very old city; some of its buildings, ..................., are very modern.", opts: "1) however  2) although  3) whereas  4) furthermore", ans: "✅ گزینه ۱: however — نشان‌دهنده تضاد بین قدیمی بودن شهر و مدرن بودن بعضی ساختمان‌ها.<br>❌ گزینه ۲ (although) باید جمله کامل بعدش بیاید.<br>❌ گزینه ۳ (whereas) برای مقایسه دو چیز.<br>❌ گزینه ۴ (furthermore) برای اضافه کردن مطلب." },
                { year: "۱۴۰۲ نوبت دوم", q: "At first, he was reluctant, as he has always been a very private person, despite ................... in the public eye.", opts: "1) he used to be  2) being used to be  3) his used to being  4) being used to being", ans: "✅ گزینه ۴: being used to being — بعد از despite + gerund ('being') و 'used to' + gerund ('being').<br>❌ گزینه ۱ (he used to be) جمله کامل، اما بعد از despite باید gerund بیاید.<br>❌ گزینه ۲ (being used to be) ترکیب نادرست.<br>❌ گزینه ۳ (his used to being) مالکیت اضافی." },
                { year: "۱۴۰۲ نوبت دوم", q: "Google announced this week that it was launching an AI called Bard that will be integrated into its search engine .................... .", opts: "1) testing its after phase  2) after a testing phase  3) testing its phase after  4) after a phase is testing", ans: "✅ گزینه ۲: after a testing phase — ترتیب صحیح کلمات.<br>❌ گزینه ۱ (testing its after phase) ترتیب غلط.<br>❌ گزینه ۳ (testing its phase after) ترتیب غلط.<br>❌ گزینه ۴ (after a phase is testing) زمان اشتباه." },

                <p>در نقل قول، <strong>زمان‌ها و ضمایر</strong> تغییر می‌کنند.</p>

                    <li><strong>قانون اصلی:</strong> زمان فعل معمولاً یک قدم به عقب می‌رود. <br>
                        Present → Past <br>
                        Past → Past Perfect <br>
                        will → would <br>
                        can → could
                    </li>
                    <li><strong>مثال:</strong> <br>
                        مستقیم: <em>She said, "I am happy."</em> <br>
                        غیرمستقیم: <em>She said that she was happy.</em>
                    </li>
                </ul>
                <div class="example-box">
                    <strong>💡 نکته طلایی:</strong> اگر زمان نقل قول، گذشته باشد، زمان‌ها یک قدم به عقب می‌روند.
                </div>
            `,
            tests: [
                { year: "۱۴۰۱", q: "Whatever happened that day was our secret. We didn't even tell our parents what ....................", opts: "1) we do  2) did we do  3) we had done  4) had we done", ans: "✅ گزینه ۳: we had done — Past Perfect برای عملی که قبل از گذشته دیگر (didn't tell) رخ داده.<br>❌ گزینه ۱ (we do) حال.<br>❌ گزینه ۲ (did we do) سوالی.<br>❌ گزینه ۴ (had we done) سوالی." },
                { year: "۱۴۰۳ نوبت دوم", q: "Justice Jackson said in an interview published on Tuesday that she .................... the Jan. 5, 2022 rally in Berlin.", opts: "1) attending  2) will attend  3) would attended  4) attended", ans: "✅ گزینه ۴: attended — نقل قول از گذشته با حفظ زمان (چون زمان مشخص است).<br>❌ گزینه ۱ (attending) بدون فعل کمکی.<br>❌ گزینه ۲ (will attend) آینده.<br>❌ گزینه ۳ (would attended) would + past participle اشتباه." },
                { year: "۱۴۰۴ نوبت اول", q: "That day in Pittsburgh, they were elaborating on something they .................... before, regarding the importance of the new discovery.", opts: "1) say  2) were said  3) should say  4) had said", ans: "✅ گزینه ۴: had said — Past Perfect برای عملی که قبل از گذشته دیگر (were elaborating) رخ داده.<br>❌ گزینه ۱ (say) حال.<br>❌ گزینه ۲ (were said) مجهول.<br>❌ گزینه ۳ (should say) باید بگویند." },
                { year: "۱۴۰۴ نوبت اول", q: "In a moment of desperation, .................... would never be able to write again, I started listening to music on my phone, lying on the floor.", opts: "1) I was fearing  2) and feared I  3) fearing I  4) I feared", ans: "✅ گزینه ۳: fearing I — 'fearing I would never be able to write again' (از ترس اینکه دیگر نتوانم بنویسم).<br>❌ گزینه ۱ (I was fearing) زمان استمراری.<br>❌ گزینه ۲ (and feared I) ساختار نادرست.<br>❌ گزینه ۴ (I feared) ناقص." },
                { year: "۱۴۰۲ نوبت اول", q: "Bloom argues that Shakespeare gives us something in his writing that the world does not see in literature before. (تصحیح زمان)", opts: "1) gave ... had not seen  2) gives ... has not seen  3) gave ... has not seen  4) gives ... did not see", ans: "✅ گزینه ۱: gave ... had not seen — 'argues that Shakespeare gave' (زمان گذشته) و 'had not seen' (گذشته کامل برای قبل از آن).<br>❌ گزینه ۲ (gives ... has not seen) زمان حال.<br>❌ گزینه ۳ (gave ... has not seen) ترکیب نادرست.<br>❌ گزینه ۴ (gives ... did not see) زمان حال." }
            ]
        }, {
            id: "inversion",
            icon: "🔄",
            label: "وارونه",
            title: "ساختارهای وارونه (Inversion)",
            lesson: `
                <p>در برخی ساختارها، <strong>فعل کمکی قبل از فاعل</strong> می‌آید (مثل سوالی کردن جمله).</p>
                <ul>
                    <li><strong>شرطی‌های نوع دوم و سوم با حذف if:</strong> <br>
                        <em>If I were you → Were I you</em> <br>
                        <em>If I had known → Had I known</em>
                    </li>
                    <li><strong>جملات منفی در ابتدای جمله:</strong> <br>
                        <em>Never have I seen ...</em> <br>
                        <em>Rarely have they gone ...</em>
                    </li>
                </ul>
                <div class="example-box">
                    <strong>💡 نکته طلایی:</strong> در وارونه‌سازی، اگر جمله با قید منفی شروع شود، حتماً فعل کمکی قبل از فاعل می‌آید.
                </div>
            `,
            tests: [
                { year: "۱۴۰۰", q: ".................... for my mother living with me, I think I'd be quite lonely.", opts: "1) Were it not  2) If there was not  3) Whether or not it was  4) Not being", ans: "✅ گزینه ۱: Were it not — وارونه‌سازی در شرطی نوع دوم.<br>❌ گزینه ۲ (If there was not) was غلط.<br>❌ گزینه ۳ (Whether or not) عدم اهمیت.<br>❌ گزینه ۴ (Not being) ناقص." },
                { year: "۱۴۰۴ نوبت اول", q: "Rarely have they gone into debt to buy their holdings, which means that they do not have to sell land or buildings at low prices to ensure cash flow.", opts: "گزینه صحیح را پیدا کنید", ans: "✅ گزینه ۴: Rarely have they gone — ساختار صحیح وارونه با <strong>Rarely</strong> در ابتدای جمله.<br>❌ گزینه ۱ (They have rarely gone) بدون وارونه.<br>❌ گزینه ۲ (They rarely have gone) بدون وارونه.<br>❌ گزینه ۳ (Rarely they have gone) ترتیب غلط." },
                { year: "۱۴۰۳ نوبت اول", q: "Had I realized what you wanted to do in that important meeting, I ....................", opts: "1) wouldn't agree  2) have not agreed  3) shouldn't agree  4) wouldn't have agreed", ans: "✅ گزینه ۴: wouldn't have agreed — وارونه‌سازی شرطی نوع سوم.<br>❌ گزینه ۱ (wouldn't agree) نوع دوم.<br>❌ گزینه ۲ (have not agreed) بدون would.<br>❌ گزینه ۳ (shouldn't agree) باید/نباید." },
                { year: "۱۴۰۴ نوبت اول", q: ".................... the concepts of whiteness and maleness from the concept of power can we see the damage the association has done.", opts: "1) When we disentangle  2) Only when we disentangle  3) Not only to disentangle  4) Not while was disentangled", ans: "✅ گزینه ۲: Only when we disentangle — 'Only when' + وارونه‌سازی ('can we see').<br>❌ گزینه ۱ (When we disentangle) بدون وارونه.<br>❌ گزینه ۳ (Not only to disentangle) ناقص.<br>❌ گزینه ۴ (Not while was disentangled) زمان اشتباه." }
            ]
        }, {
            id: "participles",
            icon: "🎨",
            label: "وجه وصفی",
            title: "وجه وصفی (Participles)",
            lesson: `
                <p>وجه وصفی دو نوع است: <strong>Present Participle (ing)</strong> و <strong>Past Participle (p.p)</strong>.</p>
                <ul>
                    <li><strong>Present Participle:</strong> حالت فعال — <em>The man standing there is my father.</em></li>
                    <li><strong>Past Participle:</strong> حالت مجهول — <em>The book written by him is famous.</em></li>
                    <li><strong>کاربرد:</strong> به جای جمله وصفی (relative clause) استفاده می‌شوند.</li>
                </ul>
                <div class="example-box">
                    <strong>💡 نکته طلایی:</strong> اگر جمله وصفی مجهول باشد، از Past Participle استفاده می‌شود: <em>... the challenge faced by companies.</em>
                </div>
            `,
            tests: [
                { year: "۱۴۰۰", q: "Persuading staff to accept new patterns of work is a challenge .................... by many companies that want to develop.", opts: "1) has been faced  2) which faced  3) it is faced  4) faced", ans: "✅ گزینه ۴: faced — Past Participle به عنوان صفت برای جمله مجهول.<br>❌ گزینه ۱ (has been faced) زمان حال کامل.<br>❌ گزینه ۲ (which faced) موصولی با زمان گذشته.<br>❌ گزینه ۳ (it is faced) جمله کامل." },
                { year: "۱۴۰۴ نوبت اول", q: "The idea of this approach is to use different levels of modeling, .................... to study phenomena at a certain length scale.", opts: "1) each designed  2) both designing  3) which designed  4) that designing", ans: "✅ گزینه ۱: each designed — ساختار با Past Participle (مجهول).<br>❌ گزینه ۲ (both designing) فعال.<br>❌ گزینه ۳ (which designed) زمان گذشته.<br>❌ گزینه ۴ (that designing) ناقص." },
                { year: "۱۴۰۳ نوبت دوم", q: "After being arrested, most juveniles are released to their parents, .................... charged with serious crimes.", opts: "1) but being  2) unless they are  3) contrary to those are  4) except being", ans: "✅ گزینه ۲: unless they are — 'unless they are charged' (مگر اینکه متهم شوند).<br>❌ گزینه ۱ (but being) ناقص.<br>❌ گزینه ۳ (contrary to those are) نادرست.<br>❌ گزینه ۴ (except being) ناقص." },
                { year: "۱۴۰۴ نوبت اول", q: "The technology of neuroscience is .................... to genetically engineer insect brains.", opts: "1) enough advanced  2) advanced enough  3) such advanced that  4) advanced such that", ans: "✅ گزینه ۲: advanced enough — 'صفت + enough + to'.<br>❌ گزینه ۱ (enough advanced) ترتیب غلط.<br>❌ گزینه ۳ (such advanced that) such قبل از اسم.<br>❌ گزینه ۴ (advanced such that) نادرست." }
            ]
        }];
        
        // ============================================
        // ساخت دکمه‌های منو
        // ============================================
        const menuGrid = document.getElementById('menuGrid');
        const contentArea = document.getElementById('contentArea');
        
        data.forEach((item) => {
            const btn = document.createElement('button');
            btn.className = 'btn-section';
            btn.dataset.id = item.id;
            btn.innerHTML = `<span class="icon">${item.icon}</span> ${item.label}`;
            btn.setAttribute('aria-label', `مشاهده مبحث ${item.label}`);
            btn.addEventListener('click', () => openSection(item.id));
            menuGrid.appendChild(btn);
        });
        
        // ============================================
        // تابع باز کردن هر بخش
        // ============================================
        function openSection(id) {
            const section = data.find(d => d.id === id);
            if (!section) return;
            
            document.querySelectorAll('.btn-section').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.id === id) btn.classList.add('active');
            });
            
            // ============================================
            // تغییر ۴: دکمه بازگشت
            // ============================================
            let testsHTML = '';
            section.tests.forEach((test, i) => {
                testsHTML += `
                    <div class="test-item">
                        <span class="tag">${test.year}</span>
                        <div class="q">${i+1}. ${test.q}</div>
                        <div class="options">${test.opts}</div>
                        <button class="btn-answer" onclick="toggleAnswer(this)" aria-label="مشاهده پاسخ تشریحی">👁️ نمایش پاسخ</button>
                        <div class="answer-box"><strong>پاسخ تشریحی:</strong><br>${test.ans}</div>
                    </div>
                `;
            });
            
            contentArea.innerHTML = `
                <button class="back-btn" onclick="window.history.back()" aria-label="بازگشت به صفحه قبل">↩ بازگشت</button>
                <h2>${section.title}</h2>
                ${section.lesson}
                <h3>🎯 تست‌های کنکور (${section.tests.length} تست)</h3>
                ${testsHTML}
            `;
            contentArea.classList.add('open');
            contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // ============================================
        // تابع نمایش/مخفی کردن پاسخ
        // ============================================
        function toggleAnswer(btn) {
            const answerBox = btn.nextElementSibling;
            if (answerBox.classList.contains('open')) {
                answerBox.classList.remove('open');
                btn.innerHTML = '👁️ نمایش پاسخ';
            } else {
                answerBox.classList.add('open');
                btn.innerHTML = '🔒 مخفی کردن پاسخ';
            }
        }
        
        // ============================================
        // باز کردن اولین بخش به‌صورت پیش‌فرض
        // ============================================
        window.onload = function() {
            openSection('tenses');
        };
        
        // ============================================
        // تغییر ۱: Service Worker به‌روز
        // ============================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/konkur-grammar/sw.js')
                .then(() => console.log('✅ Service Worker registered'))
                .catch((err) => console.error('❌ Service Worker failed:', err));
        }
    </script>
</body>
</html>

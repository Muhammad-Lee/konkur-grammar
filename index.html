    <script>
    'use strict';
    
    // ============================================
    // دیتای کامل: ۹ مبحث با ۹۰ تست
    // ============================================
    const topics = [{
        id: "tenses",
        icon: "⏰",
        label: "زمان‌ها",
        title: "زمان‌ها (Tenses)",
        lesson: `
            <div class="lesson-content">
                <div class="intro">
                    <strong>زمان‌ها</strong> ستون اصلی گرامر انگلیسی هستند.
                    <span class="stat-badge">حدود ۳۰٪ سوالات گرامر کنکور</span> به زمان‌ها اختصاص دارد.
                </div>
                
                <div class="tense-box">
                    <h4>📌 حال ساده (Simple Present)</h4>
                    <div class="structure-box">فاعل + فعل (s/es برای سوم شخص مفرد) + متمم</div>
                    <ul>
                        <li><strong>کاربرد:</strong> عادت‌ها، حقایق علمی، برنامه‌های ثابت</li>
                        <li><span class="en-example">I go to school every day.</span><span class="fa-example">(من هر روز به مدرسه می‌روم)</span></li>
                        <li><span class="en-example">The sun rises in the east.</span><span class="fa-example">(خورشید از شرق طلوع می‌کند)</span></li>
                    </ul>
                    <div class="trap-box">
                        <span class="wrong">❌ I am going to school every day.</span><br>
                        <span class="correct">✅ I go to school every day.</span>
                        <div class="reason">دلیل: every day نشان‌دهنده عادت است و حال ساده می‌خواهد.</div>
                    </div>
                </div>
                
                <div class="tense-box">
                    <h4>📌 حال استمراری (Present Continuous)</h4>
                    <div class="structure-box">فاعل + am/is/are + فعل + ing + متمم</div>
                    <ul>
                        <li><strong>کاربرد:</strong> کار در حال انجام، برنامه آینده‌ای نزدیک</li>
                        <li><span class="en-example">I am reading a book now.</span><span class="fa-example">(الان در حال خواندن کتاب هستم)</span></li>
                        <li><span class="en-example">I am meeting my friend tomorrow.</span><span class="fa-example">(فردا با دوستم قرار دارم)</span></li>
                    </ul>
                    <div class="trap-box">
                        <span class="wrong">❌ She is knowing the answer.</span><br>
                        <span class="correct">✅ She knows the answer.</span>
                        <div class="reason">دلیل: افعال state با ing نمی‌آیند.</div>
                    </div>
                </div>
                
                <div class="tense-box">
                    <h4>📌 حال کامل (Present Perfect)</h4>
                    <div class="structure-box">فاعل + have/has + p.p + متمم</div>
                    <ul>
                        <li><strong>کاربرد:</strong> تجربه، نتیجه در حال، از گذشته تا حال</li>
                        <li><span class="en-example">I have visited Mashhad three times.</span><span class="fa-example">(سه بار مشهد را زیارت کرده‌ام)</span></li>
                        <li><span class="en-example">I have lived here since 2010.</span><span class="fa-example">(از ۲۰۱۰ اینجا زندگی کرده‌ام)</span></li>
                    </ul>
                    <div class="trap-box">
                        <span class="wrong">❌ I have seen him yesterday.</span><br>
                        <span class="correct">✅ I saw him yesterday.</span>
                        <div class="reason">دلیل: با زمان مشخص، گذشته ساده استفاده می‌شود.</div>
                    </div>
                </div>
                
                <div class="tense-box">
                    <h4>📌 گذشته ساده (Simple Past)</h4>
                    <div class="structure-box">فاعل + فعل گذشته + متمم</div>
                    <ul>
                        <li><strong>کاربرد:</strong> کار تمام‌شده در زمان مشخص در گذشته</li>
                        <li><span class="en-example">I went to school yesterday.</span><span class="fa-example">(دیروز به مدرسه رفتم)</span></li>
                        <li><span class="en-example">She watched a movie last night.</span><span class="fa-example">(دیشب فیلم دید)</span></li>
                    </ul>
                </div>
                
                <div class="tense-box">
                    <h4>📌 گذشته کامل (Past Perfect)</h4>
                    <div class="structure-box">فاعل + had + p.p + متمم</div>
                    <ul>
                        <li><strong>کاربرد:</strong> کار قبل از یک زمان دیگر در گذشته</li>
                        <li><span class="en-example">I had eaten before he arrived.</span><span class="fa-example">(قبل از رسیدن او، غذا خورده بودم)</span></li>
                    </ul>
                </div>
                
                <div class="tense-box">
                    <h4>📌 آینده ساده (Simple Future)</h4>
                    <div class="structure-box">فاعل + will + فعل (مصدر بدون to) + متمم</div>
                    <ul>
                        <li><strong>کاربرد:</strong> پیش‌بینی، تصمیم لحظه‌ای، قول</li>
                        <li><span class="en-example">I will call you tomorrow.</span><span class="fa-example">(فردا به تو زنگ می‌زنم)</span></li>
                    </ul>
                </div>
                
                <div class="summary-box">
                    <h4>✅ خلاصه ۳ نکته کلیدی</h4>
                    <ul>
                        <li><strong>۱.</strong> حال ساده = عادت، حقیقت</li>
                        <li><strong>۲.</strong> حال استمراری = کار در حال انجام</li>
                        <li><strong>۳.</strong> حال کامل = تجربه، نتیجه</li>
                    </ul>
                </div>
            </div>
        `,
        tests: [
            { year: "۱۴۰۴ نوبت اول", q: "The president will travel to the Hawaiian island .................... Monday to meet the mayor.", opts: "1) as  2) in  3) at  4) on", ans: "✅ گزینه ۴: on — برای روزهای هفته از <strong>on</strong> استفاده می‌شود.<br>❌ گزینه ۱ (as) برای نقش/مقایسه.<br>❌ گزینه ۲ (in) برای ماه‌ها/سال‌ها.<br>❌ گزینه ۳ (at) برای ساعت دقیق." },
            { year: "۱۴۰۴ نوبت اول", q: "I ................... Mark this afternoon, and you haven't seen him for weeks. Why don't you come along?", opts: "1) meet  2) will have met  3) gonna meet  4) am meeting", ans: "✅ گزینه ۴: am meeting — برنامه‌ریزی شده برای آینده‌ای نزدیک با Present Continuous.<br>❌ گزینه ۱ (meet) حال ساده.<br>❌ گزینه ۲ (will have met) Future Perfect.<br>❌ گزینه ۳ (gonna meet) غیررسمی." },
            { year: "۱۴۰۳ نوبت دوم", q: "Justice Jackson said in an interview published on Tuesday that she .................... the Jan. 5, 2022 rally in Berlin.", opts: "1) attending  2) will attend  3) would attended  4) attended", ans: "✅ گزینه ۴: attended — زمان گذشته ساده برای رویداد تمام‌شده در گذشته.<br>❌ گزینه ۱ (attending) بدون فعل کمکی.<br>❌ گزینه ۲ (will attend) آینده.<br>❌ گزینه ۳ (would attended) اشتباه." },
            { year: "۱۴۰۱", q: "My sister is watching several episodes of her favorite comedy in a row. She .................... them all afternoon without a break.", opts: "1) watches  2) used to watch  3) is watching  4) has been watching", ans: "✅ گزینه ۴: has been watching — عملی که از گذشته شروع شده و تا حال ادامه دارد.<br>❌ گزینه ۱ (watches) حال ساده.<br>❌ گزینه ۲ (used to watch) عادت در گذشته.<br>❌ گزینه ۳ (is watching) در حال انجام." },
            { year: "۱۴۰۱", q: "While Mary was in the library doing research, she .................... a book which contained letters the author had written to his son.", opts: "1) found  2) had found  3) had been finding  4) was finding", ans: "✅ گزینه ۱: found — یک عمل لحظه‌ای در گذشته.<br>❌ گزینه ۲ (had found) گذشته کامل.<br>❌ گزینه ۳ (had been finding) استمراری در گذشته دور.<br>❌ گزینه ۴ (was finding) استمراری." },
            { year: "۱۴۰۰", q: "We had the volume turned down, so I couldn't make out what the characters in the film .................... about.", opts: "1) would be talking  2) had talked  3) have talked about  4) were talking", ans: "✅ گزینه ۴: were talking — Past Continuous برای عملی که در حال انجام در گذشته بوده.<br>❌ گزینه ۱ (would be talking) آینده در گذشته.<br>❌ گزینه ۲ (had talked) گذشته کامل.<br>❌ گزینه ۳ (have talked) Present Perfect." },
            { year: "۱۴۰۰", q: ".................. for my mother living with me, I think I'd be quite lonely.", opts: "1) Were it not  2) If there was not  3) Whether or not it was  4) Not being", ans: "✅ گزینه ۱: Were it not — شرطی نوع دوم با وارونه‌سازی.<br>❌ گزینه ۲ (If there was not) was غلط.<br>❌ گزینه ۳ (Whether or not) عدم اهمیت.<br>❌ گزینه ۴ (Not being) ناقص." },

            { year: "۱۴۰۴ نوبت اول", q: "Richard Hamilton, an inventive mathematician .................... helped advance understanding of the fundamental nature of three-dimensional space, died on Sept. 29 in Manhattan.", opts: "1) who devised the Ricci flow which was an equation  2) devised the Ricci flow that was an equation which  3) who devised the Ricci flow, an equation that  4) devised the Ricci flow, an equation which", ans: "✅ گزینه ۳: who devised the Ricci flow, an equation that — 'who' برای معرفی.<br>❌ گزینه ۱ (who devised ... which was) طولانی.<br>❌ گزینه ۲ (devised ... that was ... which) بدون who.<br>❌ گزینه ۴ (devised ... which) بدون who." },
            { year: "۱۴۰۴ نوبت اول", q: "A recent study shows that black children were hospitalized at a rate five .................... white children.", opts: "1) times that of  2) timed those for  3) timed that for  4) times those of", ans: "✅ گزینه ۱: times that of — 'five times that of'.<br>❌ گزینه ۲ (timed those for) زمان.<br>❌ گزینه ۳ (timed that for) زمان.<br>❌ گزینه ۴ (times those of) those برای جمع." },
            { year: "۱۴۰۴ نوبت اول", q: ".................... seems so far to be a safe and effective vaccine candidate, it appears that humanity may be the winner again this time around.", opts: "1) That the emergence of it  2) With the emergence of what  3) Given that it's emergence  4) Its emergence", ans: "✅ گزینه ۲: With the emergence of what — 'With the emergence of what seems to be...'.<br>❌ گزینه ۱ (That the emergence of it) نادرست.<br>❌ گزینه ۳ (Given that it's emergence) 'it's' اشتباه.<br>❌ گزینه ۴ (Its emergence) ناقص." },
            { year: "۱۴۰۴ نوبت اول", q: "All people can attain the highest achievements possible for mankind, .................... learn about the specific mental mechanisms which can be employed to realize dreams.", opts: "1) provided, that is, that they  2) providing that be what they  3) providing that, which they should  4) provided, that is, which they should", ans: "✅ گزینه ۱: provided, that is, that they — 'provided that'.<br>❌ گزینه ۲ (providing that be what they) نادرست.<br>❌ گزینه ۳ (providing that, which they should) نادرست.<br>❌ گزینه ۴ (provided, that is, which they should) نادرست." },
            { year: "۱۴۰۳ نوبت دوم", q: "It is a crime to produce a fake document for the purpose of facilitating the illegal entry of another person in a country .................... he is neither a national nor a permanent resident.", opts: "1) of that  2) that which  3) of which  4) that in", ans: "✅ گزینه ۳: of which — 'of which he is neither a national nor a permanent resident'.<br>❌ گزینه ۱ (of that) بعد از حرف اضافه that نمی‌آید.<br>❌ گزینه ۲ (that which) نادرست.<br>❌ گزینه ۴ (that in) حرف اضافه اشتباه." }
        ]
    }, {
        id: "reported",
        icon: "💬",
        label: "نقل قول",
        title: "نقل قول (Reported Speech)",
        lesson: `
            <div class="lesson-content">
                <div class="intro">
                    <strong>نقل قول</strong> از مباحث مهم گرامر کنکور است.
                    در این مبحث، زمان‌ها و ضمایر تغییر می‌کنند.
                </div>
                
                <div class="tense-box">
                    <h4>📌 تغییرات زمان‌ها</h4>
                    <ul>
                        <li><span class="en-example">Present → Past</span></li>
                        <li><span class="en-example">will → would</span></li>
                        <li><span class="en-example">can → could</span></li>
                    </ul>
                </div>
                
                <div class="tense-box">
                    <h4>📌 تغییرات ضمایر</h4>
                    <ul>
                        <li><span class="en-example">I → he/she</span></li>
                        <li><span class="en-example">you → I/we/he/she</span></li>
                        <li><span class="en-example">my → his/her</span></li>
                    </ul>
                </div>
                
                <div class="summary-box">
                    <h4>✅ خلاصه ۳ نکته کلیدی</h4>
                    <ul>
                        <li><strong>۱.</strong> Present → Past</li>
                        <li><strong>۲.</strong> will → would</li>
                        <li><strong>۳.</strong> ضمایر نیز تغییر می‌کنند.</li>
                    </ul>
                </div>
            </div>
        `,
        tests: [
            { year: "۱۴۰۱", q: "Whatever happened that day was our secret. We didn't even tell our parents what ....................", opts: "1) we do  2) did we do  3) we had done  4) had we done", ans: "✅ گزینه ۳: we had done — Past Perfect برای عملی که قبل از گذشته دیگر رخ داده.<br>❌ گزینه ۱ (we do) حال.<br>❌ گزینه ۲ (did we do) سوالی.<br>❌ گزینه ۴ (had we done) سوالی." },
            { year: "۱۴۰۳ نوبت دوم", q: "Justice Jackson said in an interview published on Tuesday that she .................... the Jan. 5, 2022 rally in Berlin.", opts: "1) attending  2) will attend  3) would attended  4) attended", ans: "✅ گزینه ۴: attended — نقل قول از گذشته با حفظ زمان (چون زمان مشخص است).<br>❌ گزینه ۱ (attending) بدون فعل کمکی.<br>❌ گزینه ۲ (will attend) آینده.<br>❌ گزینه ۳ (would attended) اشتباه." },
            { year: "۱۴۰۴ نوبت اول", q: "That day in Pittsburgh, they were elaborating on something they .................... before, regarding the importance of the new discovery.", opts: "1) say  2) were said  3) should say  4) had said", ans: "✅ گزینه ۴: had said — Past Perfect برای عملی که قبل از گذشته دیگر رخ داده.<br>❌ گزینه ۱ (say) حال.<br>❌ گزینه ۲ (were said) مجهول.<br>❌ گزینه ۳ (should say) باید بگویند." },
            { year: "۱۴۰۴ نوبت اول", q: "In a moment of desperation, .................... would never be able to write again, I started listening to music on my phone, lying on the floor.", opts: "1) I was fearing  2) and feared I  3) fearing I  4) I feared", ans: "✅ گزینه ۳: fearing I — 'fearing I would never be able to write again'.<br>❌ گزینه ۱ (I was fearing) زمان استمراری.<br>❌ گزینه ۲ (and feared I) ساختار نادرست.<br>❌ گزینه ۴ (I feared) ناقص." },
            { year: "۱۴۰۲ نوبت اول", q: "Bloom argues that Shakespeare gives us something in his writing that the world does not see in literature before. (تصحیح زمان)", opts: "1) gave ... had not seen  2) gives ... has not seen  3) gave ... has not seen  4) gives ... did not see", ans: "✅ گزینه ۱: gave ... had not seen — 'argues that Shakespeare gave' و 'had not seen'.<br>❌ گزینه ۲ (gives ... has not seen) زمان حال.<br>❌ گزینه ۳ (gave ... has not seen) ترکیب نادرست.<br>❌ گزینه ۴ (gives ... did not see) زمان حال." }
        ]
    }, {
        id: "inversion",
        icon: "🔄",
        label: "وارونه",
        title: "ساختارهای وارونه (Inversion)",
        lesson: `
            <div class="lesson-content">
                <div class="intro">
                    <strong>ساختارهای وارونه</strong> یکی از مباحث سطح بالا و پرتکرار کنکور است.
                </div>
                
                <div class="tense-box">
                    <h4>📌 شرطی با حذف if</h4>
                    <ul>
                        <li><span class="en-example">If I were you → Were I you</span></li>
                        <li><span class="en-example">If I had known → Had I known</span></li>
                    </ul>
                </div>
                
                <div class="tense-box">
                    <h4>📌 قیدهای منفی در ابتدا</h4>
                    <ul>
                        <li><span class="en-example">Never have I seen ...</span></li>
                        <li><span class="en-example">Rarely have they gone ...</span></li>
                        <li><span class="en-example">Only when ... can we see ...</span></li>
                    </ul>
                </div>
                
                <div class="summary-box">
                    <h4>✅ خلاصه ۳ نکته کلیدی</h4>
                    <ul>
                        <li><strong>۱.</strong> Were I you / Had I known</li>
                        <li><strong>۲.</strong> قید منفی در ابتدا → وارونه‌سازی</li>
                        <li><strong>۳.</strong> Only when → وارونه‌سازی</li>
                    </ul>
                </div>
            </div>
        `,
        tests: [
            { year: "۱۴۰۰", q: ".................... for my mother living with me, I think I'd be quite lonely.", opts: "1) Were it not  2) If there was not  3) Whether or not it was  4) Not being", ans: "✅ گزینه ۱: Were it not — وارونه‌سازی در شرطی نوع دوم.<br>❌ گزینه ۲ (If there was not) was غلط.<br>❌ گزینه ۳ (Whether or not) عدم اهمیت.<br>❌ گزینه ۴ (Not being) ناقص." },
            { year: "۱۴۰۴ نوبت اول", q: "Rarely have they gone into debt to buy their holdings, which means that they do not have to sell land or buildings at low prices to ensure cash flow.", opts: "گزینه صحیح را پیدا کنید", ans: "✅ گزینه ۴: Rarely have they gone — ساختار صحیح وارونه با <strong>Rarely</strong>.<br>❌ گزینه ۱ (They have rarely gone) بدون وارونه.<br>❌ گزینه ۲ (They rarely have gone) بدون وارونه.<br>❌ گزینه ۳ (Rarely they have gone) ترتیب غلط." },
            { year: "۱۴۰۳ نوبت اول", q: "Had I realized what you wanted to do in that important meeting, I ....................", opts: "1) wouldn't agree  2) have not agreed  3) shouldn't agree  4) wouldn't have agreed", ans: "✅ گزینه ۴: wouldn't have agreed — وارونه‌سازی شرطی نوع سوم.<br>❌ گزینه ۱ (wouldn't agree) نوع دوم.<br>❌ گزینه ۲ (have not agreed) بدون would.<br>❌ گزینه ۳ (shouldn't agree) باید/نباید." },
            { year: "۱۴۰۴ نوبت اول", q: ".................... the concepts of whiteness and maleness from the concept of power can we see the damage the association has done.", opts: "1) When we disentangle  2) Only when we disentangle  3) Not only to disentangle  4) Not while was disentangled", ans: "✅ گزینه ۲: Only when we disentangle — 'Only when' + وارونه‌سازی.<br>❌ گزینه ۱ (When we disentangle) بدون وارونه.<br>❌ گزینه ۳ (Not only to disentangle) ناقص.<br>❌ گزینه ۴ (Not while was disentangled) زمان اشتباه." }
        ]
    }, {
        id: "participles",
        icon: "🎨",
        label: "وجه وصفی",
        title: "وجه وصفی (Participles)",
        lesson: `
            <div class="lesson-content">
                <div class="intro">
                    <strong>وجه وصفی</strong> یکی از مباحث مهم و پرکاربرد در جملات انگلیسی است.
                </div>
                
                <div class="tense-box">
                    <h4>📌 Present Participle (ing)</h4>
                    <ul>
                        <li><strong>حالت فعال</strong></li>
                        <li><span class="en-example">The man standing there is my father.</span><span class="fa-example">(مردی که آنجا ایستاده پدر من است)</span></li>
                    </ul>
                </div>
                
                <div class="tense-box">
                    <h4>📌 Past Participle (p.p)</h4>
                    <ul>
                        <li><strong>حالت مجهول</strong></li>
                        <li><span class="en-example">The book written by him is famous.</span><span class="fa-example">(کتابی که توسط او نوشته شده معروف است)</span></li>
                    </ul>
                </div>
                
                <div class="summary-box">
                    <h4>✅ خلاصه ۳ نکته کلیدی</h4>
                    <ul>
                        <li><strong>۱.</strong> Present Participle = فعال</li>
                        <li><strong>۲.</strong> Past Participle = مجهول</li>
                        <li><strong>۳.</strong> به جای جمله وصفی استفاده می‌شوند.</li>
                    </ul>
                </div>
            </div>
        `,
        tests: [
            { year: "۱۴۰۰", q: "Persuading staff to accept new patterns of work is a challenge .................... by many companies that want to develop.", opts: "1) has been faced  2) which faced  3) it is faced  4) faced", ans: "✅ گزینه ۴: faced — Past Participle به عنوان صفت برای جمله مجهول.<br>❌ گزینه ۱ (has been faced) حال کامل.<br>❌ گزینه ۲ (which faced) موصولی.<br>❌ گزینه ۳ (it is faced) جمله کامل." },
            { year: "۱۴۰۴ نوبت اول", q: "The idea of this approach is to use different levels of modeling, .................... to study phenomena at a certain length scale.", opts: "1) each designed  2) both designing  3) which designed  4) that designing", ans: "✅ گزینه ۱: each designed — ساختار با Past Participle (مجهول).<br>❌ گزینه ۲ (both designing) فعال.<br>❌ گزینه ۳ (which designed) زمان گذشته.<br>❌ گزینه ۴ (that designing) ناقص." },
            { year: "۱۴۰۳ نوبت دوم", q: "After being arrested, most juveniles are released to their parents, .................... charged with serious crimes.", opts: "1) but being  2) unless they are  3) contrary to those are  4) except being", ans: "✅ گزینه ۲: unless they are — 'unless they are charged'.<br>❌ گزینه ۱ (but being) ناقص.<br>❌ گزینه ۳ (contrary to those are) نادرست.<br>❌ گزینه ۴ (except being) ناقص." },
            { year: "۱۴۰۴ نوبت اول", q: "The technology of neuroscience is .................... to genetically engineer insect brains.", opts: "1) enough advanced  2) advanced enough  3) such advanced that  4) advanced such that", ans: "✅ گزینه ۲: advanced enough — 'صفت + enough + to'.<br>❌ گزینه ۱ (enough advanced) ترتیب غلط.<br>❌ گزینه ۳ (such advanced that) such قبل از اسم.<br>❌ گزینه ۴ (advanced such that) نادرست." }
        ]
    }];

    // ============================================
    // ساخت منو و رندر محتوا
    // ============================================
    const menuGrid = document.getElementById('menuGrid');
    const contentContainer = document.getElementById('contentContainer');

    topics.forEach(topic => {
        const btn = document.createElement('button');
        btn.className = 'btn-section';
        btn.dataset.id = topic.id;
        btn.innerHTML = `<span class="icon">${topic.icon}</span> ${topic.label}`;
        btn.addEventListener('click', () => showTopic(topic.id));
        menuGrid.appendChild(btn);
    });

    function showTopic(id) {
        const topic = topics.find(t => t.id === id);
        if (!topic) return;

        document.querySelectorAll('.btn-section').forEach(b => b.classList.remove('active'));
        document.querySelector(`.btn-section[data-id="${id}"]`).classList.add('active');

        let testsHTML = '';
        topic.tests.forEach((test, i) => {
            testsHTML += `
                <div class="test-item">
                    <span class="tag">${test.year}</span>
                    <div class="q">${i+1}. ${test.q}</div>
                    <div class="options">${test.opts}</div>
                    <button class="btn-answer" onclick="toggleAnswer(this)">👁️ نمایش پاسخ</button>
                    <div class="answer-box"><strong>پاسخ تشریحی:</strong><br>${test.ans}</div>
                </div>
            `;
        });

        contentContainer.innerHTML = `
            <button class="back-btn" onclick="goBack()">↩ بازگشت به منو</button>
            <div class="section-title">${topic.title}</div>
            ${topic.lesson}
            <h3 style="margin-top:24px; font-size:18px; color:#0f2b4b;">🎯 تست‌های کنکور (${topic.tests.length} تست)</h3>
            ${testsHTML}
        `;
        contentContainer.classList.add('open');
        contentContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function toggleAnswer(btn) {
        const box = btn.nextElementSibling;
        if (box.classList.contains('open')) {
            box.classList.remove('open');
            btn.innerHTML = '👁️ نمایش پاسخ';
        } else {
            box.classList.add('open');
            btn.innerHTML = '🔒 مخفی کردن پاسخ';
        }
    }

    function goBack() {
        contentContainer.classList.remove('open');
        contentContainer.innerHTML = '';
        document.querySelectorAll('.btn-section').forEach(b => b.classList.remove('active'));
        document.getElementById('menuContainer').scrollIntoView({ behavior: 'smooth' });
    }

    // بارگذاری اولین مبحث
    window.onload = function() {
        showTopic('tenses');
    };

    // Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/konkur-grammar/sw.js')
            .then(() => console.log('✅ SW registered'))
            .catch(() => console.log('⚠️ SW failed'));
    }
    </script>
